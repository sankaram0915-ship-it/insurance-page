<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Sankara Moise, Licensed Life Insurance Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D;
    --parchment:#FBF8F2;
    --gold:#C9973F;
    --ink-soft:#5B6570;
    --line:rgba(20,33,61,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    color:#22262B;
    background:var(--parchment);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:480px;
    text-align:center;
  }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    display:block;
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    color:var(--navy);
    font-size:2.2rem;
    line-height:1.15;
  }
  p{
    color:var(--ink-soft);
    margin-top:18px;
    font-size:1.05rem;
    line-height:1.6;
  }
  a.btn{
    display:inline-block;
    margin-top:32px;
    border:1px solid var(--navy);
    color:var(--navy);
    text-decoration:none;
    padding:13px 26px;
    border-radius:2px;
    font-size:0.9rem;
    transition:all .2s ease;
  }
  a.btn:hover{background:var(--navy); color:var(--parchment);}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Inquiry Received</span>
    <h1>Thank you — you're on my list.</h1>
    <p>I've received your details and will follow up personally within a day or two to walk through your options. No pressure, no obligation — just a real conversation about how to protect your family's future.</p>
    <a href="index.html" class="btn">Back to home</a>
  </div>
</body>
</html>
